<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2050" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="2050" fill="#f8fafc"/>
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">"Recommend a Trip" — Sequence Diagram</text>
  <text x="750" y="54" text-anchor="middle" font-size="12" fill="#64748b">src/app/recommend/page.tsx → src/lib/api/index.ts → src/app/api/recommendations/route.ts → api.py → engines/ollama_engine.py → Groq</text>

  <!-- ===================== LIFELINES ===================== -->
  <!-- columns: User, RecommendPage(UI), api.getRecommendations, Next API route, FastAPI api.py, ollama_engine.py, Groq API, tripStore -->
  <g font-size="11.5" font-weight="700" fill="#0f172a">
    <rect x="30"  y="75" width="130" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="95" y="99" text-anchor="middle">User</text>

    <rect x="205" y="75" width="150" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="280" y="93" text-anchor="middle">recommend/page.tsx</text>
    <text x="280" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">(Next.js UI)</text>

    <rect x="400" y="75" width="150" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="475" y="93" text-anchor="middle">lib/api/index.ts</text>
    <text x="475" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">getRecommendations()</text>

    <rect x="595" y="75" width="170" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="680" y="93" text-anchor="middle">api/recommendations</text>
    <text x="680" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">route.ts (Next API, Vercel)</text>

    <rect x="800" y="75" width="150" height="40" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="875" y="93" text-anchor="middle">api.py</text>
    <text x="875" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">POST /api/recommendations</text>

    <rect x="985" y="75" width="180" height="40" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1075" y="93" text-anchor="middle">ollama_engine.py</text>
    <text x="1075" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">recommend()</text>

    <rect x="1200" y="75" width="150" height="40" rx="8" fill="#fae8ff" stroke="#c026d3"/>
    <text x="1275" y="93" text-anchor="middle">Groq API</text>
    <text x="1275" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">openai/gpt-oss-120b</text>

    <rect x="1385" y="75" width="100" height="40" rx="8" fill="#e0e7ff" stroke="#818cf8"/>
    <text x="1435" y="93" text-anchor="middle">tripStore</text>
    <text x="1435" y="107" text-anchor="middle" font-size="9" font-weight="400" fill="#334155">Zustand</text>
  </g>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3">
    <line x1="95" y1="115" x2="95" y2="1980"/>
    <line x1="280" y1="115" x2="280" y2="1980"/>
    <line x1="475" y1="115" x2="475" y2="1980"/>
    <line x1="680" y1="115" x2="680" y2="1980"/>
    <line x1="875" y1="115" x2="875" y2="1980"/>
    <line x1="1075" y1="115" x2="1075" y2="1980"/>
    <line x1="1275" y1="115" x2="1275" y2="1980"/>
    <line x1="1435" y1="115" x2="1435" y2="1980"/>
  </g>

  <!-- ===================== STEP 1: submit ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 95 150 L 280 150" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="100" y="144">1. Submits preferences (vibe filters, budget, days,</text>
    <text x="100" y="158">   passengers, constraints) → handleSubmit()</text>
  </g>

  <!-- ===================== STEP 2: api.getRecommendations ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 280 195 L 475 195" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="288" y="189">2. api.getRecommendations({'{'} passengers, total_budget,</text>
    <text x="288" y="203">   days, group_size, preference, constraints {'}'})</text>
  </g>

  <!-- ===================== STEP 3: fetch to Next API route ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 475 240 L 680 240" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="483" y="234">3. fetch POST /api/recommendations</text>
    <text x="483" y="248">   (relative Next.js API route)</text>
  </g>

  <!-- ===================== STEP 4: session/rate-limit check via Prisma ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="620" y="270" width="120" height="65" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="680" y="285" text-anchor="middle" font-weight="700" fill="#9a3412">Prisma check</text>
    <text x="680" y="298" text-anchor="middle" font-size="9">session lookup,</text>
    <text x="680" y="310" text-anchor="middle" font-size="9">DailyUserStat</text>
    <text x="680" y="322" text-anchor="middle" font-size="9">apiCallsRecommendations</text>
    <text x="680" y="333" text-anchor="middle" font-size="8.5" fill="#b45309">limit: 50/day (non-admin)</text>
  </g>

  <!-- ===================== STEP 5: proxy to FastAPI ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 680 360 L 875 360" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="688" y="354">4. fetch(`${'{'}PYTHON_API_URL{'}'}/recommendations`)</text>
    <text x="688" y="368" font-size="10" fill="#64748b">   body streamed straight through (avoids OOM)</text>
  </g>

  <!-- ===================== STEP 6: api.py handler ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="815" y="390" width="120" height="80" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="875" y="405" text-anchor="middle" font-weight="700" fill="#14532d">get_recommendations()</text>
    <text x="875" y="418" text-anchor="middle" font-size="9">parses dict:</text>
    <text x="875" y="430" text-anchor="middle" font-size="8.7">passengers, total_budget,</text>
    <text x="875" y="441" text-anchor="middle" font-size="8.7">days, preference,</text>
    <text x="875" y="452" text-anchor="middle" font-size="8.7">group_size, constraints</text>
    <text x="875" y="465" text-anchor="middle" font-size="8.5" fill="#166534">asyncio.to_thread(...)</text>
  </g>

  <!-- ===================== STEP 7: call recommend() ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 875 495 L 1075 495" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="883" y="489">5. recommend(passengers, total_budget, days,</text>
    <text x="883" y="503">   preference, group_size, constraints)</text>
  </g>

  <!-- ===================== STEP 8: build_prompt ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="1000" y="525" width="290" height="140" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1145" y="542" text-anchor="middle" font-weight="700" fill="#14532d">build_prompt()</text>
    <text x="1010" y="558" font-size="9.3">• resolves num_pax (group_size or city count)</text>
    <text x="1010" y="571" font-size="9.3">• per_person = total_budget // num_pax</text>
    <text x="1010" y="584" font-size="9.3">• matches preference against guidance_rules</text>
    <text x="1010" y="597" font-size="9.3">  (12 keyword→city-list rules: mountains, beaches,</text>
    <text x="1010" y="610" font-size="9.3">  heritage, veg/non-veg/food, wildlife, etc.)</text>
    <text x="1010" y="623" font-size="9.3">• injects CONTEXT city hints + exclusions</text>
    <text x="1010" y="636" font-size="9.3">• injects HARD USER CONSTRAINTS (if provided)</text>
    <text x="1010" y="649" font-size="9.3" font-weight="700" fill="#166534">• injects cost-floor rules: budget is a MAXIMUM,</text>
    <text x="1010" y="661" font-size="9.3" font-weight="700" fill="#166534">  not a target — cheap dest. stays cheap</text>
  </g>

  <!-- ===================== STEP 9: call_ollama ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 1075 690 L 1275 690" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="1083" y="684">6. call_ollama(prompt) → POST</text>
    <text x="1083" y="698">   api.groq.com/openai/v1/chat/completions</text>
  </g>

  <!-- ===================== STEP 10: request payload details ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="1120" y="715" width="330" height="90" rx="6" fill="#fae8ff" stroke="#c026d3"/>
    <text x="1285" y="732" text-anchor="middle" font-weight="700" fill="#701a75">Request payload</text>
    <text x="1130" y="748" font-size="9.3">model: "openai/gpt-oss-120b"</text>
    <text x="1130" y="761" font-size="9.3">messages: [system: "expert Indian travel planner...",</text>
    <text x="1130" y="774" font-size="9.3">           user: prompt]</text>
    <text x="1130" y="787" font-size="9.3">temperature: 0.4, max_tokens: 4000,</text>
    <text x="1130" y="799" font-size="9.3">response_format: {'{'} type: "json_object" {'}'}</text>
  </g>

  <!-- ===================== STEP 11: key rotation loop (429) ===================== -->
  <g>
    <rect x="1000" y="825" width="440" height="230" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="1220" y="847" text-anchor="middle" font-size="12.5" font-weight="700" fill="#881337">loop: while keys_tried &lt; 9</text>
    <text x="1220" y="863" text-anchor="middle" font-size="9.5" fill="#64748b">9-key round-robin rotation (GROQ_API_KEY_1..9)</text>

    <path d="M 1075 880 L 1275 880" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="1015" y="895" font-size="9.5" fill="#334155">os.getenv(f"GROQ_API_KEY_{'{'}CURRENT_GROQ_KEY_INDEX{'}'}")</text>
    <text x="1015" y="908" font-size="9.5" fill="#334155">— skip if key missing/placeholder, else send request</text>

    <path d="M 1275 925 L 1075 925" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrowRed)" stroke-dasharray="5,3"/>
    <text x="1015" y="940" font-size="9.5" fill="#b91c1c" font-weight="700">HTTP 429 rate-limited</text>

    <text x="1015" y="958" font-size="9.3" fill="#334155">CURRENT_GROQ_KEY_INDEX = (idx % 9) + 1</text>
    <text x="1015" y="972" font-size="9.3" fill="#334155">keys_tried += 1 → retry with next key</text>

    <rect x="1015" y="985" width="410" height="55" rx="6" fill="#ffffff" stroke="#fb7185"/>
    <text x="1220" y="1002" text-anchor="middle" font-size="9.5" font-weight="700" fill="#881337">exit conditions</text>
    <text x="1220" y="1017" text-anchor="middle" font-size="9" fill="#334155">success → return choices[0].message.content</text>
    <text x="1220" y="1030" text-anchor="middle" font-size="9" fill="#334155">non-429 error → return "EXCEPTION: ..."  |  9/9 exhausted → error JSON</text>
  </g>

  <!-- ===================== STEP 12: success response ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 1275 1090 L 1075 1090" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="1083" y="1084">7. 200 OK — raw JSON string</text>
    <text x="1083" y="1098" font-size="10" fill="#64748b">   (choices[0].message.content)</text>
  </g>

  <!-- ===================== STEP 13: parse_response ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="960" y="1120" width="330" height="105" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1125" y="1137" text-anchor="middle" font-weight="700" fill="#14532d">parse_response(raw)</text>
    <text x="970" y="1153" font-size="9.3">1. attempt direct json.loads(raw)</text>
    <text x="970" y="1166" font-size="9.3">2. fallback: regex-extract {'{'}.*{'}'} and json.loads() that</text>
    <text x="970" y="1179" font-size="9.3">3. if dict has "destinations" key → return list</text>
    <text x="970" y="1195" font-size="9.3" fill="#b91c1c">on total failure → logs error, returns []</text>
    <text x="970" y="1210" font-size="9.3" fill="#b91c1c">→ recommend() emits fallback_error stub destination</text>
  </g>

  <!-- ===================== STEP 14: dedup + clamp ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="960" y="1245" width="330" height="150" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="1125" y="1262" text-anchor="middle" font-weight="700" fill="#14532d">recommend() post-processing</text>
    <text x="970" y="1280" font-size="9.5" font-weight="700">Deduplicate by city name</text>
    <text x="970" y="1293" font-size="9">  seen_names set, keeps first occurrence per</text>
    <text x="970" y="1306" font-size="9">  dest["name"].strip().lower() → up to 10 unique</text>
    <text x="970" y="1325" font-size="9.5" font-weight="700">Clamp budgets to user max</text>
    <text x="970" y="1338" font-size="9">  per category: COST_PER_PERSON_PER_DAY fallback</text>
    <text x="970" y="1351" font-size="9">  budget_estimate = min(llm_estimate or fallback,</text>
    <text x="970" y="1364" font-size="9">                        total_budget)</text>
    <text x="970" y="1377" font-size="9">  perPersonEstimate = budget_estimate // num_pax</text>
  </g>

  <!-- ===================== STEP 15: return up the chain ===================== -->
  <g font-size="11" fill="#1e293b">
    <path d="M 1075 1420 L 875 1420" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="883" y="1414">8. return destinations: list[dict]</text>

    <path d="M 875 1455 L 680 1455" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="688" y="1449">9. JSONResponse (FastAPI auto-serializes list)</text>

    <path d="M 680 1490 L 475 1490" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowDash)"/>
    <text x="330" y="1484">10. NextResponse — response body streamed</text>
    <text x="330" y="1497" font-size="10" fill="#64748b">    straight through (same content-type)</text>

    <path d="M 475 1525 L 280 1525" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowDash)"/>
    <text x="105" y="1519">11. resolves fetch Promise → data: array</text>
    <text x="105" y="1532" font-size="10" fill="#64748b">    of destination objects</text>
  </g>

  <!-- ===================== STEP 16: setRawResults / render grid ===================== -->
  <g font-size="10.5" fill="#334155">
    <rect x="205" y="1555" width="230" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="320" y="1572" text-anchor="middle" font-weight="700" fill="#1e3a8a">page.tsx state update</text>
    <text x="215" y="1588" font-size="9.3">setFormCollapsed(true)</text>
    <text x="215" y="1601" font-size="9.3">setRawResults(data)</text>
    <text x="215" y="1617" font-size="9" fill="#64748b">note: NOT written to tripStore yet —</text>
    <text x="215" y="1630" font-size="9" fill="#64748b">results held in local component state</text>
  </g>

  <g font-size="11" fill="#1e293b">
    <path d="M 280 1670 L 95 1670" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="100" y="1664">12. Recommendations grid renders</text>
    <text x="100" y="1678" font-size="10" fill="#64748b">    (destination cards: name, why, budget, matchScore)</text>
  </g>

  <!-- ===================== STEP 17: user selects a destination ===================== -->
  <g>
    <rect x="60" y="1710" width="1400" height="230" rx="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <text x="750" y="1733" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">opt: user clicks a destination card → handleSelectDestination(destName)</text>

    <path d="M 95 1755 L 280 1755" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="100" y="1749">13. Selects a destination card</text>

    <path d="M 280 1790 L 1435 1790" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="288" y="1784">14. useTripStore.getState().reset() then setTripDetails({'{'} mode: 'recommend', destination {'}'})</text>

    <text x="288" y="1810" font-size="10" fill="#64748b">    also resets useBudgetStore, useItineraryStore, useCacheStore.clearCache()</text>
    <text x="288" y="1826" font-size="10" fill="#64748b">    useBudgetStore.setTotalBudget(form.budget)</text>
    <text x="288" y="1842" font-size="10" fill="#64748b">    pads/adds passengers into tripStore to match groupSize</text>

    <path d="M 1435 1865 L 280 1865" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowDash)"/>
    <text x="288" y="1859">15. tripStore updated — user proceeds into /plan flow with</text>
    <text x="288" y="1900" font-size="10" fill="#64748b">    destination + budget + passengers persisted (dbStorage)</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="11">
    <text x="60" y="1975" font-weight="700" fill="#0f172a">Legend:</text>
    <line x1="130" y1="1970" x2="175" y2="1970" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="185" y="1974" fill="#334155">Request / call</text>
    <line x1="330" y1="1970" x2="375" y2="1970" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrowDash)"/>
    <text x="385" y="1974" fill="#334155">Response / return</text>
    <line x1="530" y1="1970" x2="575" y2="1970" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)" stroke-dasharray="5,3"/>
    <text x="585" y="1974" fill="#334155">Error (429 rate-limit)</text>
  </g>
</svg>
